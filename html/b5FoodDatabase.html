<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>
        <link rel="stylesheet" href="../styles/style.css">
    </head>

    <body>
        <div class="page-header multi-box-container wrap">
            <h2 class="eighties-theme">
                <img src="../images/feast_32.png" height="72" alt="banquet foods">
                Foods
            </h2>
            <h2 class="modern-theme">
                <span class="shadow-text" data-index="font-art">🧀🍯</span>
                Foods
                <span class="shadow-text" data-index="font-art">🍞🐟</span>
            </h2>

            <p id="seasonal-heading">data for regular meals and snacks (currently indexed to <span>Spring</span>)</p>
            
            <!-- ADD NEW FOOD BUTTON -->
            <div class="multi-box-container row">
                <button class="outset-md" data-action="new-blank-food">add new food</button>
            </div>
        </div>


        

        <!-- uncategorised foods might not show -->
        <div id="uncategorised-card" class="card hidden">
            <div class="card side-by-side">
                <h3 id="uncategorised-heading">foods mentioned in Log but not categorised</h3>
                <br>
                <div id="uncategorised-log-toggle" class="toggle-switch">
                    <button class="toggle-option" data-action="show-data">show</button>
                    <button class="toggle-option" data-action="hide-data">hide</button>
                </div>
            </div>
            <div id="uncategorised-food-list" class="card side-by-side">
                <table class="uncategorised-foods-table">
                    <thead>
                        <tr id="uncategorised-heading-row">
                            <th>food name</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="uncategorised-rules-tbody">
                        <!-- rules printed out here -->

                    </tbody>
                </table>            
            </div>
        </div>

        <!-- modal only shows up on addNew/edit -->
        <div id="food-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">food details</h3>
                    <button class="modal-close" data-action="close-modal" data-index="model">&times;</button>
                </div>
                <form data-action="save-entry">
                    <div>
                        <label>name</label>
                        <input type="text" id="entry-name" data-index="name" required>
                    </div>
                    <div>
                        <label>carbohydrate in 1 serving</label>
                        <input type="number" data-index="glucose-per-serving" value="" placeholder="e.g. 50 (grams)" step="1" min="1" required>
                    </div>
                    <div>
                        <label>serving size</label>
                        <input type="text" data-index="food-serving" value="" placeholder="e.g., 2 teaspoons">
                    </div>                
                    <div>
                        <label>glycemic index</label>
                        <select data-index="food-gi">
                            <option value="very slow">very slow</option>
                            <option value="slow">slow</option>
                            <option value="medium">medium</option>
                            <option value="fast">fast</option>
                            <option value="very fast">very fast</option>
                        </select>
                    </div>
                    <div>
                        <label>meal time</label>
                        <select data-index="food-category">
                            <!-- food cats in here -->
                        </select>
                    </div>
                    <div>
                        <label>food group</label>
                        <select data-index="food-group">
                            <!-- food groups in here -->
                        </select>
                    </div>
                    <div>
                        <label>notes</label>
                        <input type="text" data-index="food-notes" value="" placeholder="e.g. I love this!">
                    </div>
                    <div>
                        <!-- data-index filled in with food if it's editing existing food -->
                        <button type="submit" data-action="save-modal" data-index="">save</button>
                        <button type="button" data-action="close-modal" data-index="model" class="secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="wrapper">
                <h3>existing food details by category</h3>
                <div class="button-container">
                    <select id="category-selected" data-index="food-category" class="width-lg">
                        <!-- category options go in here -->
                    </select>
                    <span>
                        <!-- food images could go in here -->
                    </span>
                    <select id="group-selected" data-index="food-group" class="width-lg">
                        <!-- group options go in here -->
                    </select>
                </div>
            </div>
            <div class="wrapper">
                <table class="border-ad-hoc food-database">
                    <thead>
                        <tr id="heading-row">
                            <th>food</th>
                            <th>serve</th>
                            <th>glucose per serve</th>
                            <th>insulin per serve</th>
                            <th class="two-button-column">edit/ delete</th>
                        </tr>
                    </thead>
                    <tbody id="thumb-rules-tbody">
                        <!-- rules printed out here -->
                    </tbody>
                </table>
            </div>        
        </div>

        <script type="module" src="../js/views/statistics/foodDatabase.js"></script>

    </body>
</html>
